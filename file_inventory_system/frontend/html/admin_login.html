<!DOCTYPE html>
<html>
<head>
    <title>File Management & Archiving System</title>
    
    <link rel="icon" type="image/png" href="/image/logo.png">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    
     <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script> 

   <link rel="stylesheet" href="/frontend/css/login.css">
   <script src="/frontend/js/login.js"></script> 


</head>

<body>

<div class="topbar">
    <div class="topbar-title">
        File Management & Archiving System  v1.02</div>
    <div class="topbar-right">
        <span id="clock"></span>

        <button onclick="toggleDarkMode()" class="btn btn-sm btn-outline-light">
            <i class="bi bi-moon"></i>
        </button>
    </div>
</div>

<div class="container d-flex align-items-center justify-content-center login-wrapper">

    <div class="login-card p-4">

        <div class="logo mb-1">HMDAS</div>
        <div class="subtitle">Administrative Login</div>

        <form method="POST" action="/login/">
            {% csrf_token %}

            <!-- USERNAME -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control" required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="password" id="password" class="form-control" required>
                    <span class="input-group-text" onclick="togglePassword()" style="cursor:pointer;">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </span>
                </div>

                <!-- ? FIXED FORGOT PASSWORD LINK -->
                <div class="text-end mt-1">
                    <a href="{% url 'forgot_password' %}" style="font-size:13px;">
                        Forgot password?
                    </a>
                </div>
            </div>

            <!-- LOGIN BUTTON -->
            <button class="btn btn-login w-100 text-white">
                Login
            </button>

        </form>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger mt-3 text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    </div>

</div>

<footer class="app-footer">
<div class="footer-left">
&copy; 2026 HMD-HMDAS. All rights reserved.
</div>

<div class="footer-center">
"Building ideas into reality."
</div>

<div class="footer-right">
<span>Internship System</span>
</div>
</footer>

</body>
</body>
</html>
