<!DOCTYPE html>
<html>
<head>
    <title>File Management & Archiving System</title>
    
    <link rel="icon" type="image/png" href="/image/logo.png">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SAME DEPENDENCIES -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/forgot_password.css">
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <div>File Management & Archiving System  v1.02</div>
    <div id="clock"></div>
</div>

<!-- CARD -->
<div class="container d-flex align-items-center justify-content-center login-wrapper">
<div class="login-card p-4">

    <div class="logo mb-1">HMDAS</div>
    <div class="subtitle">Reset Your Password</div>

    <!-- STEP 1 -->
    <div id="step1" class="step active">
        <label>Email</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="Enter your email">
        </div>
        <button class="btn btn-main w-100 mt-3" onclick="sendCode()">Send Code</button>
        <div id="msg1" class="message"></div>
    </div>

    <div id="step2" class="step">
    <label>Verification Code</label>

    <div class="input-group">
        <span class="input-group-text">
            <i class="bi bi-shield-lock"></i>
        </span>
        <input type="text" id="code" class="form-control" placeholder="Enter code">
    </div>

    <button class="btn btn-main w-100 mt-3" onclick="verifyCode()">
        Verify Code
    </button>

    <div id="msg2" class="message text-danger mt-2"></div>
</div>
    <!-- STEP 3 -->
    <div id="step3" class="step">
        <label>New Password</label>
        <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="pass1" class="form-control" placeholder="New password">
        </div>

        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="pass2" class="form-control" placeholder="Confirm password">
        </div>

        <button class="btn btn-main w-100 mt-3" onclick="resetPassword()">Change Password</button>
        <div id="msg3" class="message"></div>
    </div>

</div>
</div>

<!-- FOOTER -->
<footer class="app-footer">
    <div>&copy; 2026 HMD-HMDAS</div>
    <div style="text-align:center;">"Building ideas into reality."</div>
    <div style="text-align:right;">Internship System</div>
</footer>
<script src="/frontend/js/forgot_password.js"></script> 

</body>
</html>
